<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark navy background -->
  <rect width="32" height="32" rx="7" fill="#1C3548"/>
  <!-- Teal top accent -->
  <rect x="0" y="0" width="32" height="3.5" rx="2" fill="#3C6E71"/>
  <!-- Orbit ring -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#3C6E71" stroke-width="1.2" stroke-dasharray="3,2.5"/>
  <!-- Centre dot -->
  <circle cx="16" cy="16" r="4" fill="#3C6E71"/>
  <circle cx="16" cy="16" r="2" fill="#FFFFFF" opacity="0.9"/>
  <!-- Orbit node top -->
  <circle cx="16" cy="7" r="2.2" fill="#3C6E71"/>
  <!-- Orbit node right -->
  <circle cx="25" cy="16" r="2.2" fill="rgba(60,110,113,0.65)"/>
  <!-- Orbit node left -->
  <circle cx="7" cy="16" r="2.2" fill="rgba(60,110,113,0.65)"/>
</svg>
